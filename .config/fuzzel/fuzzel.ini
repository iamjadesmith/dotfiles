# Colors come from colors.ini, a link darkman points at
# tokyonight-night.ini or catppuccin-latte.ini.
include=~/.config/fuzzel/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=13
prompt="❯  "
icon-theme=Adwaita
terminal=ghostty -e
layer=overlay
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=24
letter-spacing=0.2

[border]
width=2
radius=14
selection-radius=8
